apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: radar-gateway
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000     # Traefik's "web" entryPoint
      hostname: kolumbus-delay-radar.swedencentral.cloudapp.azure.com
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: kolumbus-delay-radar.swedencentral.cloudapp.azure.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: radar-tls
