apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: delay-radar
resources:
  - namespace.yaml
  - storageclass.yaml
  - postgres.yaml
  - collector.yaml
  - api.yaml
  - gateway.yaml
  - httproute.yaml
  - networkpolicy.yaml
  - podmonitors.yaml
  - backup.yaml
images:
  - name: ghcr.io/baselabu/kolumbus-delay-radar/radar-collector
    newTag: 07627d01b9fe500d7dbc6ae6236f9bd237afedec
  - name: ghcr.io/baselabu/kolumbus-delay-radar/radar-api
    newTag: 07627d01b9fe500d7dbc6ae6236f9bd237afedec
# Grafana dashboard as code: the Grafana sidecar loads every ConfigMap labelled grafana_dashboard=1
configMapGenerator:
  - name: grafana-dashboard-delay-radar
    files:
      - dashboards/delay-radar.json
    options:
      labels:
        grafana_dashboard: "1"
      disableNameSuffixHash: true
